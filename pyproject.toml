[project]
name = "hr-policy-rag"
version = "0.1.0"
description = "Enterprise HR Policy RAG Assistant - Foundation & UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "reportlab>=5.0.1",
    "qdrant-client>=1.19.1",
    "fastembed>=0.8.1",
    "rank-bm25>=0.2.2",
    "litellm>=1.104.0",
    "google-cloud-storage>=3.16.0",
    "google-auth>=2.59.1",
    "langsmith>=0.14.4",
    "authlib>=1.8.0",
    "slack-bolt>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
